<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrícula | Sagrada Família</title>
  <link rel="icon" href="../../img/favicon-32x32.png" type="image/png">
  <link href="../../output.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../../js/layout.js" defer></script>
</head>

<body class="bg-cinzaClaro font-sans">
  <div id="site-header"></div>

  <main class="container mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold text-azul-700 mb-6 text-center">Formulário de Matrícula</h1>
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-xl mx-auto">
      <h2 class="text-2xl font-bold text-azul-700 mb-6 text-center">Preencha os dados do aluno</h2>
      <form method="POST" action="../../php/enviarMatricula.php" class="space-y-6">
        <!-- Nome do Aluno -->
        <div>
          <label for="nome" class="block text-cinza-700 font-semibold mb-2">Nome do Aluno</label>
          <input type="text" id="nome" name="nome" required class="w-full px-4 py-2 border border-cinza-300 rounded-md focus:outline-none focus:ring-2 focus:ring-azul-700">
        </div>

        <!-- Nome do Aluno -->
        <div>
          <label for="nascimento" class="block text-cinza-700 font-semibold mb-2">Data de Nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required class="w-full px-4 py-2 border border-cinza-300 rounded-md focus:outline-none focus:ring-2 focus:ring-azul-700">
        </div>

        <!-- Série -->
        <div>
          <label for="serie-turma" class="block text-cinza-700 font-semibold mb-2">Série/Turma</label>
          <input type="text" id="serie-turma" name="serie-turma" required class="w-full px-4 py-2 border border-cinza-300 rounded-md focus:outline-none focus:ring-2 focus:ring-azul-700">
        </div>

        <!-- Nome do Responsável -->
        <div>
          <label for="responsavel" class="block text-cinza-700 font-semibold mb-2">Nome do Responsável</label>
          <input type="text" id="responsavel" name="responsavel" required class="w-full px-4 py-2 border border-cinza-300 rounded-md focus:outline-none focus:ring-2 focus:ring-azul-700">
        </div>

        <!-- Telefone do Responsável -->
        <div>
          <label for="telefone" class="block text-cinza-700 font-semibold mb-2">Telefone do Responsável</label>
          <input type="tel" id="telefone" name="telefone" required class="w-full px-4 py-2 border border-cinza-300 rounded-md focus:outline-none focus:ring-2 focus:ring-azul-700">
        </div>

        <!-- E-mail do Responsável -->
        <div>
          <label for="email" class="block text-cinza-700 font-semibold mb-2">E-mail do Responsável</label>
          <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-cinza-300 rounded-md focus:outline-none focus:ring-2 focus:ring-azul-700">
        </div>

        <!-- Botão de envio -->
        <button type="submit" class="w-full bg-rosa-700 text-white py-3 rounded-md hover:bg-rosa-900 transition">Enviar Matrícula</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
</body>

</html>
