<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagrada Familia</title>
  <link rel="icon" href="img/favicon-32x32.png" type="image/png">
  <link href="./output.css" rel="stylesheet">
  <script src="./js/biblia.js"></script>
  <script src="js/layout.js" defer></script>
</head>

<body class="bg-cinzaClaro font-sans">
  <div class="lg:container mt-4 lg:flex lg:justify-center max-lg:text-center ">
    <div class="inline-flex items-center rounded-md bg-rosa-200">
      <span class="size-2 bg-azul-700 block rounded-full relative -left-1"></span>
      <div class="flex text-azul-700 divide-x-2 divide-azul-700">
        <div class="px-4 py-2 capitalize" id="dia"></div>
        <div class="px-4 py-2" id="hora"></div>
      </div>
    </div>
    <div class="lg:text-right max-lg:text-center w-full max-lg:mt-5">
      <p id="versiculo" class="text-xs font-bold text-cinza-500"></p>
    </div>

    <!-- <img src="img/logo.png" alt="Logo">
    <h1 class="text-5xl font-bold text-sky-950 m-10">Em construção...</h1>-->
  </div>

  <div id="site-header"></div>

  <main class="relative">
    <img src="./../../img/background/bg-intro-cut.png" alt="Faxada" class="lg:w-auto lg:h-auto max-lg:h-[900px] max-md:h-[900px] max-sm:h-[900px] object-top">
    <div class="
      absolute inset-0 bg-rosa-200/50 backdrop-blur-sm lg:flex items-center ">
      <div class="
        lg:grid lg:grid-cols-2 lg:gap-4 lg:container
        max-lg:items-center">
        <div class="font-bold text-azul-700 text-left pt-8 max-lg:mt-10 max-lg:text-center">
          <h1 class="text-5xl mb-5">Colégio Sagrada Familia</h1>
          <p class="text-lg uppercase mr-8">Viva Jesus em nossos corações!</p>
          <p class="text-lg uppercase mr-8">Para sempre.</p>
          <h1 class="text-5xl text-cinzaEscuro underline mt-5">PÁGINA EM CONSTRUÇÃO</h1>
        </div>
        <div class="relative w-9/12 max-lg:mt-14 max-lg:ml-10 max-lg:mb-14">
          <img src="./../../img/logo.png" alt="Fundo" class="rounded-md shadow-lg bg-cinzaClaro/20">
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    const hora = document.getElementById('hora');
    const dia = document.getElementById('dia');

    const date = new Date();
    dia.innerText = date.toLocaleDateString('pt-BR', {
      weekday: 'long'
    }).replace('-feira', '');

    hora.innerText = date.toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
  </script>
</body>

</html>
